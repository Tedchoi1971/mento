<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compass 로그인</title><link rel="stylesheet" href="assets/app.css"><style>body{display:grid;place-items:center;min-height:100vh}.login-card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 20px 60px #173d3114}.login-card .brand{color:var(--dark);margin:0 0 28px}.login-card h1{font:700 28px Georgia;margin-bottom:8px}.login-card>p{color:var(--muted);font-size:12px;margin:0 0 24px}.login-card .field{margin:13px 0}.login-card .primary{width:100%;margin-top:10px}.login-error{min-height:18px;color:#c44e47;font-size:11px;margin-top:12px}</style></head><body><form class="login-card" id="login-form"><div class="brand"><i>C</i> Compass</div><h1>다시 오신 것을 환영합니다.</h1><p>기업자료와 공모사업 분석을 안전하게 관리하세요.</p><div class="field"><label>이메일</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>비밀번호</label><input name="password" type="password" autocomplete="current-password" required minlength="12"></div><button class="primary">로그인</button><div class="login-error" id="error"></div></form><script>document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(d)});const j=await r.json().catch(()=>({error:'서버 응답 오류'}));if(!r.ok){document.getElementById('error').textContent=j.error;return}location.href='./'});</script></body></html>
